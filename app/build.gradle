plugins {
    id 'com.android.application'
}

android {
    namespace 'com.ribaut.watchdesigner'
    compileSdk 35

    defaultConfig {
        applicationId 'com.ribaut.watchdesigner'
        minSdk 26
        targetSdk 35
        versionCode 2
        versionName '1.1'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    packagingOptions {
        resources {
            excludes += ['META-INF/versions/9/OSGI-INF/MANIFEST.MF']
        }
    }
}

dependencies {
    implementation 'com.google.android.gms:play-services-wearable:20.0.1'
    implementation('com.google.android.wearable.watchface.validator:validator-push-android:1.0.0-alpha10') {
        exclude group: 'com.google.guava', module: 'listenablefuture'
    }
    implementation 'com.android.tools.build:apksig:8.11.1'
    implementation 'org.bouncycastle:bcpkix-jdk18on:1.81'
}

tasks.register('wireWatchLink') {
    doLast {
        def f = file('src/main/java/com/ribaut/watchdesigner/MainActivity.java')
        def oldText = 'install.setOnClickListener(x->new AlertDialog.Builder(this).setTitle("Installation Watch 8").setMessage("La liaison d\'installation vers la montre est en cours d\'intégration sur cette branche de test.").setPositiveButton("OK",null).show());'
        def newText = 'install.setOnClickListener(x->WatchLink.test(this));'
        def text = f.getText('UTF-8')
        if (text.contains(oldText)) {
            f.write(text.replace(oldText, newText), 'UTF-8')
        }
    }
}

tasks.named('preBuild').configure { dependsOn tasks.named('wireWatchLink') }
