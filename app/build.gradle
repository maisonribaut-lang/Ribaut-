plugins {
    id 'com.android.application'
}

android {
    namespace 'com.ribaut.watchdesigner'
    compileSdk 35

    defaultConfig {
        applicationId 'com.ribaut.watchdesigner'
        minSdk 26
        targetSdk 35
        versionCode 2
        versionName '1.1'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
}

dependencies {
    implementation 'com.google.android.gms:play-services-wearable:20.0.1'
}
