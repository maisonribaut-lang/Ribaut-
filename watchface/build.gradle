plugins {
    id 'com.android.application'
}

android {
    namespace 'com.ribaut.watchinstaller.watchfacepush.ribauttest'
    compileSdk 36

    defaultConfig {
        applicationId 'com.ribaut.watchinstaller.watchfacepush.ribauttest'
        minSdk 33
        targetSdk 36
        versionCode 1
        versionName '1.0'
    }

    buildTypes {
        debug { minifyEnabled false }
        release { minifyEnabled false }
    }
}
