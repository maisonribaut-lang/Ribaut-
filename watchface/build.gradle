plugins {
    id 'com.android.application'
}

android {
    namespace 'com.ribaut.watchdesigner.watchfacepush.ribauttest'
    compileSdk 36

    defaultConfig {
        applicationId 'com.ribaut.watchdesigner.watchfacepush.ribauttest'
        minSdk 33
        targetSdk 36
        versionCode 1
        versionName '1.0'
    }

    buildTypes {
        debug {
            minifyEnabled true
        }
        release {
            minifyEnabled true
            shrinkResources false
            signingConfig signingConfigs.debug
        }
    }
}
