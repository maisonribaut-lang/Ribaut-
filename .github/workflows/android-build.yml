name: Build Android APK

on:
  push:
    branches: [ "main", "watch-install-link" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Configure Android SDK tools
        run: |
          echo "/usr/local/lib/android/sdk/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "/usr/local/lib/android/sdk/platform-tools" >> "$GITHUB_PATH"

      - name: Install Android platforms
        run: |
          yes | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --licenses >/dev/null || true
          /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager "platform-tools" "platforms;android-35" "platforms;android-36" "build-tools;35.0.0" "build-tools;36.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Fix Java variable collision in test branch
        run: |
          sed -i 's/for(SeekBar b:new SeekBar/for(SeekBar seek:new SeekBar/; s/)b.setOnSeekBarChangeListener(sl);/)seek.setOnSeekBarChangeListener(sl);/' app/src/main/java/com/ribaut/watchdesigner/MainActivity.java

      - name: Build WFF APK first
        run: gradle --no-daemon :watchface:assembleDebug

      - name: Download official Watch Face Push validator
        run: |
          curl --fail --location --retry 3 \
            -o validator-push-cli.jar \
            "https://dl.google.com/dl/android/maven2/com/google/android/wearable/watchface/validator/validator-push-cli/1.1.0-alpha01/validator-push-cli-1.1.0-alpha01.jar"

      - name: Validate WFF and generate validation token
        run: |
          java -jar validator-push-cli.jar \
            --apk_path=watchface/build/outputs/apk/debug/watchface-debug.apk \
            --package_name=com.ribaut.watchdesigner \
            | tee watchface-validation.txt
          test -s watchface-validation.txt
          grep -q "Validation is successful" watchface-validation.txt

      - name: Embed validated WFF into Watch 8 companion
        run: |
          TOKEN="$(sed -n 's/.*generated token: \([^[:space:]]*\).*/\1/p' watchface-validation.txt | head -n 1)"
          test -n "$TOKEN"
          mkdir -p wear/src/main/assets
          cp watchface/build/outputs/apk/debug/watchface-debug.apk wear/src/main/assets/default_watchface.apk
          printf '%s' "$TOKEN" > watchface-validation-token.txt
          echo "DEFAULT_WFF_TOKEN=$TOKEN" >> "$GITHUB_ENV"

      - name: Build phone and Watch 8 companion with validated default WFF
        run: gradle --no-daemon :app:assembleDebug :wear:assembleDebug -PdefaultWatchFaceToken="$DEFAULT_WFF_TOKEN"

      - name: Upload WFF validation result
        uses: actions/upload-artifact@v4
        with:
          name: Ribaut-WFF-Validation
          path: |
            watchface-validation.txt
            watchface-validation-token.txt
          if-no-files-found: error

      - name: Upload phone APK
        uses: actions/upload-artifact@v4
        with:
          name: Ribaut-Watch-Designer-V2-Test
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload Watch 8 companion APK
        uses: actions/upload-artifact@v4
        with:
          name: Ribaut-Watch-Installer-Watch8-V1
          path: wear/build/outputs/apk/debug/wear-debug.apk
          if-no-files-found: error

      - name: Upload Watch Face Format test APK
        uses: actions/upload-artifact@v4
        with:
          name: Ribaut-WFF-Test
          path: watchface/build/outputs/apk/debug/watchface-debug.apk
          if-no-files-found: error
