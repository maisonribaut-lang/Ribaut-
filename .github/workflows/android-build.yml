name: Build Android APK

on:
  push:
    branches: [ "main", "watch-install-link" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Configure Android SDK tools
        run: |
          echo "/usr/local/lib/android/sdk/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "/usr/local/lib/android/sdk/platform-tools" >> "$GITHUB_PATH"

      - name: Install Android platforms
        run: |
          yes | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --licenses >/dev/null || true
          /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager "platform-tools" "platforms;android-35" "platforms;android-36" "build-tools;35.0.0" "build-tools;36.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Fix Java variable collision in test branch
        run: |
          sed -i 's/for(SeekBar b:new SeekBar/for(SeekBar seek:new SeekBar/; s/)b.setOnSeekBarChangeListener(sl);/)seek.setOnSeekBarChangeListener(sl);/' app/src/main/java/com/ribaut/watchdesigner/MainActivity.java

      - name: Build phone, watch companion and WFF APKs
        run: gradle --no-daemon :app:assembleDebug :wear:assembleDebug :watchface:assembleDebug

      - name: Upload phone APK
        uses: actions/upload-artifact@v4
        with:
          name: Ribaut-Watch-Designer-V2-Test
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload Watch 8 companion APK
        uses: actions/upload-artifact@v4
        with:
          name: Ribaut-Watch-Installer-Watch8-V1
          path: wear/build/outputs/apk/debug/wear-debug.apk
          if-no-files-found: error

      - name: Upload Watch Face Format test APK
        uses: actions/upload-artifact@v4
        with:
          name: Ribaut-WFF-Test
          path: watchface/build/outputs/apk/debug/watchface-debug.apk
          if-no-files-found: error
