plugins {
    id 'com.android.application'
}

android {
    namespace 'com.ribaut.watchinstaller'
    compileSdk 36

    defaultConfig {
        applicationId 'com.ribaut.watchinstaller'
        minSdk 36
        targetSdk 36
        versionCode 1
        versionName '1.0'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.wear.watchfacepush:watchfacepush:1.0.0'
}
