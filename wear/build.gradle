plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android' version '2.1.0'
}

android {
    namespace 'com.ribaut.watchinstaller'
    compileSdk 36

    defaultConfig {
        applicationId 'com.ribaut.watchdesigner'
        minSdk 36
        targetSdk 36
        versionCode 2
        versionName '1.1'
        manifestPlaceholders = [defaultWatchFaceToken: (project.findProperty('defaultWatchFaceToken') ?: 'NOT_BUILT_WITH_VALIDATED_WFF')]
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    implementation 'androidx.wear.watchfacepush:watchfacepush:1.0.0'
    implementation 'com.google.android.gms:play-services-wearable:20.0.1'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.10.2'
}
